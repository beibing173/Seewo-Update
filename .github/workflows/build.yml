name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 发布单文件程序
        run: >
          dotnet publish src/SeewoUpdate/SeewoUpdate.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: 打包
        run: Compress-Archive -Path publish\SeewoUpdate.exe -DestinationPath SeewoUpdate-win-x64.zip -Force

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: SeewoUpdate-win-x64
          path: SeewoUpdate-win-x64.zip
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SeewoUpdate-win-x64.zip
          generate_release_notes: true
